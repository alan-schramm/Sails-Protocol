<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#0d0d0d"/><text x="60" y="70" fill="#fff" font-family="Arial" font-size="34" font-weight="700">Different stacks. Shared economic meaning.</text><text x="60" y="110" fill="#aaa" font-family="Arial" font-size="18">Technological diversity without semantic fragmentation</text><g font-family="Arial" text-anchor="middle"><g fill="#fff" font-size="18"><rect x="65" y="180" width="220" height="74" rx="14" fill="#181818" stroke="#555"/><text x="175" y="225">Mobile Wallet</text><rect x="65" y="290" width="220" height="74" rx="14" fill="#181818" stroke="#555"/><text x="175" y="335">Web Marketplace</text><rect x="65" y="400" width="220" height="74" rx="14" fill="#181818" stroke="#555"/><text x="175" y="445">Agent Interface</text><rect x="65" y="510" width="220" height="74" rx="14" fill="#181818" stroke="#555"/><text x="175" y="555">Partner Application</text></g><rect x="415" y="270" width="370" height="190" rx="28" fill="#17110a" stroke="#f7931a" stroke-width="3"/><text x="600" y="345" fill="#f7931a" font-size="28" font-weight="700">Shared Economic Meaning</text><text x="600" y="385" fill="#fff" font-size="17">Sails coordinates meaning</text><text x="600" y="416" fill="#aaa" font-size="15">without requiring technological homogeneity</text><g fill="#fff" font-size="18"><rect x="900" y="220" width="240" height="78" rx="15" fill="#181818" stroke="#f7931a"/><text x="1020" y="265">Authority</text><rect x="900" y="330" width="240" height="78" rx="15" fill="#181818" stroke="#f7931a"/><text x="1020" y="375">Conditions</text><rect x="900" y="440" width="240" height="78" rx="15" fill="#181818" stroke="#f7931a"/><text x="1020" y="485">Outcome Meaning</text></g></g></svg>