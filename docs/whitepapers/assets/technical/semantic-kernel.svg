<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#0d0d0d"/><text x="60" y="70" fill="#fff" font-family="Arial" font-size="34" font-weight="700">Sails Semantic Kernel</text><text x="60" y="110" fill="#aaa" font-family="Arial" font-size="18">The minimum properties that must remain true for Sails to remain Sails</text><g font-family="Arial" text-anchor="middle"><rect x="390" y="165" width="420" height="100" rx="24" fill="#17110a" stroke="#f7931a" stroke-width="3"/><text x="600" y="225" fill="#f7931a" font-size="28" font-weight="700">Semantic Kernel</text><rect x="70" y="355" width="310" height="120" rx="20" fill="#181818" stroke="#f7931a"/><text x="225" y="405" fill="#fff" font-size="22" font-weight="700">K1</text><text x="225" y="438" fill="#fff" font-size="17">Valid Transition</text><rect x="445" y="355" width="310" height="120" rx="20" fill="#181818" stroke="#f7931a"/><text x="600" y="405" fill="#fff" font-size="22" font-weight="700">K2</text><text x="600" y="438" fill="#fff" font-size="17">Attributed Discretion</text><rect x="820" y="355" width="310" height="120" rx="20" fill="#181818" stroke="#f7931a"/><text x="975" y="405" fill="#fff" font-size="22" font-weight="700">K3</text><text x="975" y="438" fill="#fff" font-size="17">Semantic Settlement Independence</text><rect x="390" y="545" width="420" height="70" rx="18" fill="#181818" stroke="#555"/><text x="600" y="577" fill="#fff" font-size="18">Supporting semantic rule: Assertion</text><text x="600" y="600" fill="#aaa" font-size="14">attributable · interaction-bound · never itself truth</text></g></svg>