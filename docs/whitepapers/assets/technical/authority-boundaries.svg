<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#0d0d0d"/><text x="60" y="70" fill="#fff" font-family="Arial" font-size="34" font-weight="700">Authority is not one thing</text><text x="60" y="110" fill="#aaa" font-family="Arial" font-size="18">Identity, permission and economic authority remain distinct</text><g font-family="Arial" text-anchor="middle"><rect x="70" y="180" width="200" height="75" rx="15" fill="#181818" stroke="#555"/><text x="170" y="225" fill="#fff" font-size="18">Identity</text><rect x="320" y="180" width="200" height="75" rx="15" fill="#181818" stroke="#555"/><text x="420" y="225" fill="#fff" font-size="18">Authentication</text><rect x="570" y="180" width="200" height="75" rx="15" fill="#181818" stroke="#555"/><text x="670" y="225" fill="#fff" font-size="18">Authorization</text><rect x="820" y="165" width="300" height="105" rx="20" fill="#17110a" stroke="#f7931a" stroke-width="3"/><text x="970" y="208" fill="#f7931a" font-size="19" font-weight="700">Economic Disposition</text><text x="970" y="238" fill="#fff" font-size="18">Authority</text><path d="M270 217 H320 M520 217 H570 M770 217 H820" stroke="#f7931a" stroke-width="3"/><rect x="260" y="395" width="280" height="95" rx="18" fill="#181818" stroke="#f7931a"/><text x="400" y="435" fill="#fff" font-size="19">Destination Authority</text><text x="400" y="462" fill="#aaa" font-size="14">who controls beneficiary binding</text><rect x="660" y="395" width="280" height="95" rx="18" fill="#181818" stroke="#f7931a"/><text x="800" y="435" fill="#fff" font-size="19">Execution Authority</text><text x="800" y="462" fill="#aaa" font-size="14">who may execute the mechanism</text><text x="600" y="560" fill="#f7931a" font-size="19" font-weight="700">Recommendation ≠ Authority · Capability Grant ≠ Economic Consent</text></g></svg>