<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#0d0d0d"/><text x="60" y="70" fill="#fff" font-family="Arial" font-size="34" font-weight="700">Stable semantics, replaceable execution</text><text x="60" y="110" fill="#aaa" font-family="Arial" font-size="18">Canonical macro architecture from CORE_ARCHITECTURE.md</text><g font-family="Arial" text-anchor="middle"><rect x="80" y="275" width="220" height="120" rx="18" fill="#181818" stroke="#555"/><text x="190" y="320" fill="#fff" font-size="20" font-weight="700">Modules / Rulesets</text><text x="190" y="353" fill="#aaa" font-size="15">domain meaning</text><rect x="350" y="255" width="220" height="160" rx="22" fill="#17110a" stroke="#f7931a" stroke-width="3"/><text x="460" y="315" fill="#f7931a" font-size="22" font-weight="700">Pure Core</text><text x="460" y="348" fill="#fff" font-size="15">semantic evaluation</text><text x="460" y="375" fill="#aaa" font-size="14">no I/O · no dispatch</text><rect x="620" y="255" width="220" height="160" rx="22" fill="#181818" stroke="#f7931a"/><text x="730" y="315" fill="#fff" font-size="22" font-weight="700">Runtime</text><text x="730" y="348" fill="#aaa" font-size="15">commit · ordering</text><text x="730" y="375" fill="#aaa" font-size="15">dispatch · recovery</text><rect x="890" y="275" width="220" height="120" rx="18" fill="#181818" stroke="#555"/><text x="1000" y="320" fill="#fff" font-size="20" font-weight="700">Providers</text><text x="1000" y="353" fill="#aaa" font-size="15">execute · report</text><path d="M300 335 H350 M570 335 H620 M840 335 H890" stroke="#f7931a" stroke-width="3"/><text x="595" y="240" fill="#aaa" font-size="14">Transition Record</text><text x="600" y="500" fill="#aaa" font-size="16">External mechanisms can change. Authorized meaning cannot.</text></g></svg>