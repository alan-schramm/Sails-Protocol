<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#0d0d0d"/><text x="60" y="70" fill="#fff" font-family="Arial" font-size="34" font-weight="700">Settlement identity, capability and eligibility</text><text x="60" y="110" fill="#aaa" font-family="Arial" font-size="18">Asset ≠ SettlementRail ≠ SettlementAdapter ≠ SettlementProvider</text><g font-family="Arial" text-anchor="middle"><rect x="70" y="190" width="200" height="82" rx="15" fill="#181818" stroke="#555"/><text x="170" y="238" fill="#fff" font-size="19">Asset</text><rect x="70" y="330" width="200" height="82" rx="15" fill="#181818" stroke="#555"/><text x="170" y="378" fill="#fff" font-size="19">SettlementRail</text><rect x="365" y="245" width="250" height="115" rx="20" fill="#17110a" stroke="#f7931a" stroke-width="3"/><text x="490" y="292" fill="#f7931a" font-size="21" font-weight="700">SettlementScope</text><text x="490" y="325" fill="#fff" font-size="16">explicit {asset, rail}</text><rect x="715" y="205" width="250" height="100" rx="18" fill="#181818" stroke="#f7931a"/><text x="840" y="247" fill="#fff" font-size="19">SettlementProvider</text><text x="840" y="275" fill="#aaa" font-size="14">executes capability</text><rect x="715" y="355" width="250" height="100" rx="18" fill="#181818" stroke="#f7931a"/><text x="840" y="397" fill="#fff" font-size="19">SettlementAdapter</text><text x="840" y="425" fill="#aaa" font-size="14">translates semantics</text><rect x="360" y="520" width="260" height="82" rx="16" fill="#181818" stroke="#555"/><text x="490" y="555" fill="#fff" font-size="18">Evidence / Properties</text><rect x="750" y="520" width="260" height="82" rx="16" fill="#181818" stroke="#f7931a"/><text x="880" y="555" fill="#fff" font-size="18">Production Eligibility</text><text x="880" y="580" fill="#aaa" font-size="13">governed decision</text><path d="M270 230 L365 280 M270 370 L365 325 M615 285 H715 M840 355 V305 M620 560 H750" stroke="#f7931a" stroke-width="3"/></g></svg>