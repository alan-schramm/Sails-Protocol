name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    # Mission 9.10 — the `defaults.run.working-directory: ./sails-push-ready`
    # that previously lived here was a real, confirmed bug (docs/GITHUB_PROJECT.md
    # #44/TECHNICAL_DEBT_AUDIT.md #44): the repository root IS the working
    # directory in a real `actions/checkout` — that path only ever existed
    # on one contributor's own locally-nested folder layout, never inside a
    # GitHub Actions runner. Removed; every step below now runs at the
    # actual repository root, matching every other workflow in this repo.
    #
    # Missão 11 Fase 6.3B.1 — `npm test` now includes a real-Postgres
    # integration lane (npm run test:integration:postgres); this
    # ephemeral service container is what makes that lane run for real
    # in CI instead of failing the fail-closed authorization/connectivity
    # guard. Created fresh per run, discarded afterward.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: sails_protocol
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        # Mission 9.10 — the real, confirmed root cause of every prior
        # CI Tests failure (jest-output.txt from run 33352899462: "Module
        # '@prisma/client' has no exported member 'Prisma'/'PrismaClient'/
        # 'AssetType'" across 80 suites). `npm ci` installs @prisma/client's
        # own unbuilt stub; only `prisma generate` populates its real,
        # schema-derived exports. Neither workflow ever ran it — `db:migrate`
        # (prisma migrate deploy) does not implicitly generate. This step
        # was missing, not the Postgres service container.
        run: npm run db:generate

      - name: Apply database migrations
        # Scoped to this step only — targets the ephemeral CI Postgres
        # service above, never a shared or production database.
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/sails_protocol
        run: npm run db:migrate

      - name: Run unit tests
        # Both vars scoped to this step only (Missão 11 Fase 6.3B.1) —
        # SAILS_INTEGRATION_TEST_DB_CONFIRMED is the explicit, deliberate
        # opt-in tests/integration/postgresTestHarness.ts's fail-closed
        # guard requires; DATABASE_URL points only at the ephemeral CI
        # service above. Neither var is present for the Docker
        # integration-test step below, which never needs them —
        # docker-compose.yml hardcodes its own DATABASE_URL for the
        # containers it starts and does not read this one.
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/sails_protocol
          SAILS_INTEGRATION_TEST_DB_CONFIRMED: yes-i-am-sure
        run: npm test

      - name: Run Docker integration test
        run: bash ./scripts/docker-test.sh
