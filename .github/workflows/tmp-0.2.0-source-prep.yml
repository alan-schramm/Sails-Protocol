name: Temporary 0.2.0 Source Preparation

on:
  push:
    branches:
      - release/0.2.0-source-preparation
    paths:
      - .github/workflows/tmp-0.2.0-source-prep.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/0.2.0-source-preparation
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.19.1

      - name: Regenerate package lock with npm only
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Add exact SDK 0.2.0 changelog entry
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'packages/sails-sdk/CHANGELOG.md';
          const marker = '## [Unreleased]\n';
          const entry = `## [Unreleased]\n\n## [0.2.0] - Unreleased\n\n### Changed\n- Prepare the SDK artifact identity for the controlled \`0.2.0\` release line.\n- Require \`@satsails/p2p-schemas\` \`^0.2.0\` for the published dependency surface.\n\nThis is a source-state preparation record only. Publication, registry verification, tagging, and GitHub Release completion remain separate controlled release steps.\n`;
          const text = fs.readFileSync(path, 'utf8');
          if (text.includes('## [0.2.0]')) process.exit(0);
          if (!text.includes(marker)) throw new Error('Unreleased marker not found');
          fs.writeFileSync(path, text.replace(marker, entry));
          NODE

      - name: Verify prepared source files
        shell: bash
        run: |
          set -euo pipefail
          node -e "const p=require('./package-lock.json'); if(!p.lockfileVersion) process.exit(1)"
          grep -Fq '## [0.2.0] - Unreleased' packages/sails-sdk/CHANGELOG.md
          git diff --check

      - name: Commit npm-generated lock and SDK changelog
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json packages/sails-sdk/CHANGELOG.md
          git commit -m 'chore(release): regenerate 0.2.0 lock and SDK changelog'
          git push origin HEAD:release/0.2.0-source-preparation
